---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.2
serverless_language: node
polling_url: |-
  https://api.avant2go.com/api/locations?limit=1000
  https://api.avant2go.com/api/cars
polling_headers: ''
polling_body: ''
id: 485315
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: lat
  field_type: string
  name: Latitude
  description: Map center latitude
  default: '46.0569'
- keyname: lng
  field_type: string
  name: Longitude
  description: Map center longitude
  default: '14.5058'
- keyname: zoom
  field_type: number
  name: Zoom
  description: 12 (city) to 16 (streets)
  min: 12
  max: 16
  default: 14
- keyname: models
  field_type: xhrSelect
  name: Car models
  description: Leave empty to count all models
  optional: true
  multiple: true
  endpoint: https://trmnl-avant2go.vercel.app/api/car-models
  exclude_csrf_token: true
name: Avant2Go
description: ''
refresh_interval: 15
